name: Local Supabase stack
description: Boots Supabase, serves the Edge Functions and waits until they answer.

outputs:
  anon-key:
    description: The local stack's anon key.
    value: ${{ steps.keys.outputs.anon-key }}

runs:
  using: composite
  steps:
    - uses: supabase/setup-cli@v1
      with:
        version: latest

    # Registry rate limits and half-started containers holding ports have both
    # failed this before, so tear down and retry rather than fail the job.
    - name: Start Supabase
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if supabase start; then exit 0; fi
          echo "::warning::supabase start failed (attempt $attempt of 3)"
          supabase stop --no-backup || true
          [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
        done
        exit 1

    - name: Serve the Edge Functions
      shell: bash
      run: |
        supabase functions serve --no-verify-jwt > /tmp/functions.log 2>&1 &
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:54321/functions/v1/leave-room \
            -H 'content-type: application/json' -d '{}' || true)
          # 400 is the endpoint rejecting an empty body, i.e. it's alive.
          if [ "$code" = "400" ]; then echo "functions ready"; exit 0; fi
          sleep 2
        done
        echo "::error::Edge Functions did not come up"
        cat /tmp/functions.log
        exit 1

    - id: keys
      shell: bash
      run: echo "anon-key=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_OUTPUT"
