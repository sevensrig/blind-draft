name: CI

# `npm run check`, run where it can't be skipped. The component a11y suite sat
# broken on `main` for six days before this existed, because nothing ran it but a
# human remembering to.
#
# Four jobs rather than one, so a red X says *what* broke without opening the
# log, and the slow one (e2e) doesn't hold up typecheck and lint.
#
# CI only — no deploy job. Vercel ships the frontend on `main`, and the database
# and Edge Functions go out by hand. A deploy job was written and pulled back
# out: Supabase access tokens must carry an expiry, so it would have become a red
# `main` months later with nothing actually wrong. Tracked for a revisit.

on:
  pull_request:
  push:
    branches: [main]

# A second push makes the first run irrelevant. `main` is exempt: those runs are
# the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Quieter installs, and no interactive prompts from the Supabase CLI.
  CI: true

jobs:
  static:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Edge Functions aren't part of the Vite build, so nothing else
      # typechecks them.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the Edge Functions
        run: npm run check:functions

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # `vendor.test.ts` covers drift; re-running the generator proves the
      # committed copy is what the script produces, not something hand-edited.
      - name: Vendored engine is up to date
        run: |
          npm run vendor
          if ! git diff --quiet -- supabase/functions/_shared/vendor; then
            echo "::error::supabase/functions/_shared/vendor is stale. Run 'npm run vendor' and commit."
            git diff --stat -- supabase/functions/_shared/vendor
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rulebook and fuzz suite
        run: npm run test:unit

      # Thresholds live in vitest.config.ts, scoped to src/lib/game/**.
      - name: Coverage thresholds
        run: npm run coverage

  component:
    name: Component and a11y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Real Chromium, not jsdom, so axe measures actual rendered contrast —
      # which is why this job needs a browser at all.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Components in real Chromium
        run: npm run test:component

  e2e:
    name: E2E, a11y and remote play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A local stack, so the remote specs actually run. Without it they skip and
      # a green run means nothing for the two-device paths; `REQUIRE_SUPABASE`
      # below turns that skip into a failure.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Serve the Edge Functions
        run: |
          supabase functions serve --no-verify-jwt > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:54321/functions/v1/leave-room \
              -H 'content-type: application/json' -d '{}' || true)
            # 400 is the endpoint rejecting an empty body, i.e. it's alive.
            if [ "$code" = "400" ]; then echo "functions ready"; exit 0; fi
            sleep 2
          done
          echo "::error::Edge Functions did not come up"
          cat /tmp/functions.log
          exit 1

      # Without these `remoteEnabled` is false, the online entry point hides
      # itself, and the remote specs have nothing to drive.
      - name: Point the app at the local stack
        run: |
          {
            echo "PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)"
          } >> .env

      # `build` + `preview`, never `vite dev` — the worst bug this app has
      # shipped was visible only in built output.
      - name: Playwright
        env:
          REQUIRE_SUPABASE: '1'
        run: npm run test:e2e

      - name: Edge Function logs
        if: failure()
        run: cat /tmp/functions.log || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
