name: Supabase keep-alive

# free tier pauses a project after ~7 days idle and remote play breaks.
# hits the public rooms list so postgres does real work, not just the edge.
# needs PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY as repo secrets, added
# by hand — nothing syncs them into actions (issue #17).

on:
  schedule:
    # every 3 days, off the hour. worst gap is 3 days across a month boundary.
    - cron: '12 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the public rooms endpoint
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Not configured — create repository secrets PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY. No ping was sent."
            exit 1
          fi

          # retry because a restoring project 5xxes for a few seconds.
          # `|| true` not `|| echo 000` — curl prints 000 itself and they'd concatenate.
          for attempt in 1 2 3; do
            rm -f /tmp/body
            status=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/public_room_listings?select=room_id&limit=1" || true)

            echo "attempt $attempt: status=$status"

            if [ "$status" = "200" ]; then
              break
            fi

            if [ "$attempt" != "3" ]; then
              sleep 15
            fi
          done

          # absent if the connection never opened
          if [ -s /tmp/body ]; then
            head -c 200 /tmp/body
            echo
          fi

          if [ "$status" != "200" ]; then
            echo "::error::Ping failed — expected 200, got $status after 3 attempts"
            exit 1
          fi
