name: Supabase token check

# The deploy token has to expire. This fails two weeks before it does, so the
# rotation is an email to act on rather than a red `main` after the fact.
# Needs SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets, and the
# SUPABASE_TOKEN_EXPIRES variable (YYYY-MM-DD) recorded when the token is made.

on:
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Token works and isn't about to expire
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_TOKEN_EXPIRES: ${{ vars.SUPABASE_TOKEN_EXPIRES }}
        run: scripts/check-supabase-token.sh
