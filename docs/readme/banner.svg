<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
	<title id="t">$20 Draft: two players, $20 each, bidding blind</title>
	<style>
		text { font-family: 'Space Grotesk', 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; fill: #000; }
		.cap { font-size: 22px; letter-spacing: 6px; }
		.tag { font-size: 30px; font-weight: 700; }
		.chip { font-size: 18px; letter-spacing: 3px; }
		.money { font-size: 44px; }
		.float { animation: bob 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
		.float2 { animation: bob 4s ease-in-out -2s infinite; transform-box: fill-box; transform-origin: center; }
		@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
		@media (prefers-reduced-motion: reduce) { .float, .float2 { animation: none } }
	</style>

	<rect width="1200" height="420" fill="#fffdf5" />
	<rect x="6" y="6" width="1188" height="408" fill="none" stroke="#000" stroke-width="12" />

	<text class="cap" x="70" y="92">TWO PLAYERS · $20 EACH</text>

	<!-- wordmark -->
	<rect x="82" y="122" width="250" height="140" fill="#000" />
	<rect x="70" y="110" width="250" height="140" fill="#ffd93d" stroke="#000" stroke-width="8" />
	<text x="92" y="218" font-size="104">$20</text>
	<text x="342" y="218" font-size="104">DRAFT</text>

	<text class="tag" x="70" y="318">Nobody knows what's coming next.</text>
	<text class="tag" x="70" y="360">Bid anyway.</text>

	<!-- face-down card -->
	<g class="float">
		<g transform="rotate(4 930 200)">
			<rect x="822" y="72" width="230" height="300" fill="#000" />
			<rect x="808" y="58" width="230" height="300" fill="#c4b5fd" stroke="#000" stroke-width="8" />
			<rect x="836" y="86" width="174" height="244" fill="none" stroke="#000" stroke-width="4" stroke-dasharray="14 10" />
			<text x="923" y="248" font-size="150" text-anchor="middle">?</text>
		</g>
	</g>

	<!-- wallets -->
	<g class="float2">
		<g transform="rotate(-6 790 300)">
			<rect x="718" y="268" width="150" height="96" fill="#000" />
			<rect x="710" y="260" width="150" height="96" fill="#8ecae6" stroke="#000" stroke-width="6" />
			<text class="chip" x="728" y="294">SRI</text>
			<text class="money" x="726" y="342">$20</text>
		</g>
	</g>
	<g class="float">
		<g transform="rotate(7 1100 110)">
			<rect x="1046" y="68" width="128" height="88" fill="#000" />
			<rect x="1038" y="60" width="128" height="88" fill="#ffd93d" stroke="#000" stroke-width="6" />
			<text class="chip" x="1054" y="90">ALEX</text>
			<text class="money" x="1052" y="136">$20</text>
		</g>
	</g>

	<!-- live tick -->
	<rect x="70" y="384" width="60" height="12" fill="#000" />
	<rect x="140" y="384" width="60" height="12" fill="#000" />
	<rect x="210" y="384" width="60" height="12" fill="#ff6b6b" stroke="#000" stroke-width="3" />
	<rect x="280" y="384" width="60" height="12" fill="#fff" stroke="#000" stroke-width="3" />
	<rect x="350" y="384" width="60" height="12" fill="#fff" stroke="#000" stroke-width="3" />
</svg>
