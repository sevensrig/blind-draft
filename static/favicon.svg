<!--
  Tab icon: the hero's yellow "$20" chip, reduced to the one thing that survives
  at 16px — a bold dollar sign on yellow inside a hard black border. Same tokens
  as the app (#ffd93d, #000, zero radius, no gradients).

  The glyph is a vector path from Font Awesome Free (CC BY 4.0, Fonticons Inc.)
  rather than a <text> element, because SVG favicons render text with whatever
  font the OS picks, and the mark would shift between machines.
-->
